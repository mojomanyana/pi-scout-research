name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
      - name: Install exact direct test dependencies without lifecycle scripts
        run: >-
          npm install --prefix "$RUNNER_TEMP/scout-test-deps"
          --ignore-scripts --no-audit --no-fund --save-exact
          @earendil-works/pi-coding-agent@1.5.0
          @earendil-works/pi-ai@1.5.0 typebox@1.3.27 pi-daddy@0.50.0
      - name: Run offline controls without providers or Docker
        env:
          SCOUT_PI_SDK_ROOT: ${{ runner.temp }}/scout-test-deps/node_modules/@earendil-works/pi-coding-agent
          SCOUT_DADDY_ROOT: ${{ runner.temp }}/scout-test-deps/node_modules/pi-daddy
        run: node --test --test-concurrency=1 tests/*.test.mjs
